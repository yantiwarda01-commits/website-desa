services:
  php:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: mysql
      DB_NAME: desa_db
      DB_USER: desa_user
      DB_PASSWORD: DesaPass2026!
    volumes:
      - ./app:/var/www/html

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./app:/var/www/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php

  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: DesaRoot2026!
      MYSQL_DATABASE: desa_db
      MYSQL_USER: desa_user
      MYSQL_PASSWORD: DesaPass2026!
    volumes:
      - desa_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  desa_data:

networks:
  default:
    name: website_desa_net
